services:
  # PostgreSQL Database
  - type: pserv
    name: tic-tac-toe-db
    env: docker
    plan: free
    
  # Nakama Backend
  - type: web
    name: tic-tac-toe-nakama
    env: docker
    dockerfilePath: ./Dockerfile.nakama
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tic-tac-toe-db
          property: connectionString
    
  # React Frontend
  - type: web
    name: tic-tac-toe-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
