services:
  postgres:
    image: postgres:12
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    ports:
      - "5432:5432"

  nakama:
    image: heroiclabs/nakama
    depends_on:
      - postgres
    entrypoint:
      - "/bin/sh"
      - "-ecx"
      - |
        echo "Waiting for Postgres..."
        sleep 10
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama
        exec /nakama/nakama --database.address postgres:localdb@postgres:5432/nakama --session.token_expiry_sec 7200 --session.refresh_token_expiry_sec 3600
    ports:
      - "7350:7350"
    volumes:
      - ./backend:/nakama/data/modules